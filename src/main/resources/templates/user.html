<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">

    <div class="text-white">
        <strong th:text="${user.username}"></strong>

        with roles:

        <span th:each="r : ${#authentication.authorities}"
              th:text="${r.authority} + ' '">
        </span>
    </div>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-link text-secondary text-decoration-none">
            Logout
        </button>
    </form>

</nav>

<div class="container-fluid">

    <div class="row">



        <div class="col-2 bg-white min-vh-100 border-end p-0">

            <div class="list-group rounded-0">

                <a th:href="@{/admin}"
                   class="list-group-item list-group-item-action"
                   sec:authorize="hasRole('ADMIN')">
                    Admin
                </a>

                <a th:href="@{/user}"
                   class="list-group-item list-group-item-action active">
                    User
                </a>

            </div>

        </div>



        <div class="col-10 p-4">

            <h1 class="fw-bold mb-4">
                User Information Page
            </h1>

            <div class="card">

                <div class="card-header fw-bold">
                    About User
                </div>

                <div class="card-body">

                    <table class="table table-striped align-middle">

                        <thead>

                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Roles</th>
                        </tr>

                        </thead>

                        <tbody>

                        <tr>

                            <td th:text="${user.id}"></td>

                            <td th:text="${user.firstName}"></td>

                            <td th:text="${user.lastName}"></td>

                            <td th:text="${user.age}"></td>

                            <td th:text="${user.username}"></td>

                            <td>
                                <span th:each="r : ${user.roles}"
                                      th:text="${r.name} + ' '">
                                </span>
                            </td>

                        </tr>

                        </tbody>

                    </table>



                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
