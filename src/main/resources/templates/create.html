<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>New User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <div class="text-white">
        <strong th:text="${currentUsername}"></strong>
        with roles:
        <span th:each="r : ${#authentication.authorities}"
              th:text="${r.authority} + ' '">
        </span>
    </div>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-link text-secondary text-decoration-none">
            Logout
        </button>
    </form>
</nav>

<div class="container-fluid">

    <div class="row">


        <div class="col-2 bg-white min-vh-100 border-end p-0">

            <div class="list-group rounded-0">

                <a th:href="@{/admin}"
                   class="list-group-item list-group-item-action active">
                    Admin
                </a>

                <a th:href="@{/user}"
                   class="list-group-item list-group-item-action">
                    User
                </a>

            </div>

        </div>


        <div class="col-10 p-4">

            <h1 class="fw-bold mb-4">
                Admin Panel
            </h1>


            <ul class="nav nav-tabs mb-3">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/admin}">
                        All Users
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/admin/new}">
                        New User
                    </a>
                </li>

            </ul>


            <div class="card">

                <div class="card-header fw-bold">
                    Add new user
                </div>

                    <div class="card-body d-flex justify-content-center">

                        <form th:action="@{/admin/save}"
                              th:object="${userForm}"
                              method="post"
                              style="width: 400px;">

                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-bold d-block text-center">Username</label>

                                <input class="form-control"
                                       type="text"
                                       th:field="*{username}">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('username')}"
                                     th:errors="*{username}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold d-block text-center">Password</label>

                                <input class="form-control"
                                       type="password"
                                       th:field="*{password}">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold d-block text-center">First name</label>

                                <input class="form-control"
                                       type="text"
                                       th:field="*{firstName}">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('firstName')}"
                                     th:errors="*{firstName}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold d-block text-center">Last name</label>

                                <input class="form-control"
                                       type="text"
                                       th:field="*{lastName}">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('lastName')}"
                                     th:errors="*{lastName}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold d-block text-center">Age</label>

                                <input class="form-control"
                                       type="number"
                                       th:field="*{age}">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('age')}"
                                     th:errors="*{age}">
                                </div>
                            </div>

                            <div class="mb-4">

                                <label class="form-label fw-bold d-block text-center">Roles</label>

                                <div class="form-check"
                                     th:each="role : ${allRoles}">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="roleIds"
                                           th:value="${role.id}">

                                    <label class="form-check-label"
                                           th:text="${role.name}">
                                    </label>

                                </div>

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('roleIds')}"
                                     th:errors="*{roleIds}">
                                </div>

                            </div>

                            <div class="text-center mt-4">
                                <button class="btn btn-success px-4" type="submit">
                                    Add new user
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
