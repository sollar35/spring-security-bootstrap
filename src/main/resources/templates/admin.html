<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>

    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <div class="text-white">
        <strong th:text="${currentUsername}"></strong>
        with roles:
        <span th:each="r : ${#authentication.authorities}"
              th:text="${r.authority} + ' '">
        </span>
    </div>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-link text-secondary text-decoration-none">
            Logout
        </button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">


        <div class="col-2 bg-white min-vh-100 border-end p-0">

            <div class="list-group rounded-0">

                <a th:href="@{/admin}"
                   class="list-group-item list-group-item-action active"
                   sec:authorize="hasRole('ADMIN')">
                    Admin
                </a>

                <a th:href="@{/user}"
                   class="list-group-item list-group-item-action">
                    User
                </a>

            </div>

        </div>


        <div class="col-10 p-4">

            <h1 class="fw-bold mb-4">
                Admin Panel
            </h1>

            <ul class="nav nav-tabs mb-3">

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/admin}">
                        All Users
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/admin/new}">
                        New User
                    </a>
                </li>

            </ul>

            <div class="card">

                <div class="card-header fw-bold">
                    All users
                </div>

                <div class="card-body">

                    <table class="table table-striped align-middle">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>First name</th>
                            <th>Last name</th>
                            <th>Age</th>
                            <th>Roles</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="u : ${users}">

                            <td th:text="${u.id}"></td>
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.firstName}"></td>
                            <td th:text="${u.lastName}"></td>
                            <td th:text="${u.age}"></td>

                            <td>
                                <span th:each="r : ${u.roles}"
                                      th:text="${r.name} + ' '">
                                </span>
                            </td>

                            <td>
                                <button class="btn btn-info btn-sm text-white"
                                        data-bs-toggle="modal"
                                        data-bs-target="#editModal"
                                        th:attr="
                                        data-id=${u.id},
                                        data-username=${u.username},
                                        data-firstname=${u.firstName},
                                        data-lastname=${u.lastName},
                                        data-age=${u.age},
                                        data-admin=${#authorization.expression('hasRole(''ADMIN'')')}">
                                    Edit
                                </button>
                            </td>

                            <td>
                                <button class="btn btn-danger btn-sm"
                                        data-bs-toggle="modal"
                                        data-bs-target="#deleteModal"
                                        th:attr="
                                        data-id=${u.id},
                                        data-username=${u.username}">
                                    Delete
                                </button>
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>
            </div>

        </div>
    </div>
</div>

<div class="modal fade"
     id="editModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <form id="editForm"
                  th:action="@{/admin/save}"
                  method="post">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Edit User
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <input type="hidden"
                           name="id"
                           id="edit-id">

                    <div class="mb-3">
                        <label class="form-label">Username</label>

                        <input class="form-control"
                               type="text"
                               name="username"
                               id="edit-username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">First name</label>

                        <input class="form-control"
                               type="text"
                               name="firstName"
                               id="edit-firstname">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Last name</label>

                        <input class="form-control"
                               type="text"
                               name="lastName"
                               id="edit-lastname">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Age</label>

                        <input class="form-control"
                               type="number"
                               name="age"
                               id="edit-age">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            New password
                        </label>

                        <input class="form-control"
                               type="password"
                               name="newPassword">
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Roles
                        </label>

                        <div class="form-check">

                            <input class="form-check-input"
                                   type="checkbox"
                                   name="roleIds"
                                   value="1"
                                   id="adminRole">

                            <label class="form-check-label"
                                   for="adminRole">
                                ADMIN
                            </label>

                        </div>

                        <div class="form-check">

                            <input class="form-check-input"
                                   type="checkbox"
                                   name="roleIds"
                                   value="2"
                                   id="userRole">

                            <label class="form-check-label"
                                   for="userRole">
                                USER
                            </label>

                        </div>

                    </div>

                </div>



                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Close
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<div class="modal fade"
     id="deleteModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <form th:action="@{/admin/delete}" method="post">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Confirm delete
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <input type="hidden"
                           name="id"
                           id="delete-id">

                    <p>
                        Are you sure you want to delete user:
                        <strong id="delete-username"></strong> ?
                    </p>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit"
                            class="btn btn-danger">
                        Delete
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const editModal = document.getElementById('editModal')

    editModal.addEventListener('show.bs.modal', function (event) {

        const button = event.relatedTarget

        document.getElementById('edit-id').value =
            button.getAttribute('data-id')

        document.getElementById('edit-username').value =
            button.getAttribute('data-username')

        document.getElementById('edit-firstname').value =
            button.getAttribute('data-firstname')

        document.getElementById('edit-lastname').value =
            button.getAttribute('data-lastname')

        document.getElementById('edit-age').value =
            button.getAttribute('data-age')

    })
</script>
<script>

    document.getElementById('editForm')
        .addEventListener('submit', function (e) {

            const roles =
                document.querySelectorAll(
                    '#editForm input[name="roleIds"]:checked'
                )

            if (roles.length === 0) {

                e.preventDefault()

                alert('Choose at least one role')

            }

        })

</script>
<script>

    const deleteModal =
        document.getElementById('deleteModal')

    deleteModal.addEventListener('show.bs.modal', function (event) {

        const button = event.relatedTarget

        const userId =
            button.getAttribute('data-id')

        const username =
            button.getAttribute('data-username')

        document.getElementById('delete-id').value =
            userId

        document.getElementById('delete-username').textContent =
            username

    })

</script>
</body>
</html>
